name: PictoChat legacy CI

on:
  push:
    branches:
      - development/pictochat-modernization
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5.1'
      - name: Compile and run JUnit regression tests
        run: |
          # Use setup-gradle's managed distribution instead of the old wrapper
          # downloader, whose hard-coded short socket timeout fails on CI.
          gradle --no-daemon clean test build
      - name: Verify browser JavaScript syntax
        run: node --check src/main/resources/www/main.js
      - name: Verify default HTML does not import remote captcha
        run: |
          if grep -Fq 'src="https://js.hcaptcha.com' src/main/resources/www/index.html; then
            echo "Unexpected remote captcha script"
            exit 1
          fi
