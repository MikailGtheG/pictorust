[package]
name = "pictochat-mls-lab"
version = "0.1.0"
edition = "2021"
publish = false

# Intentionally isolated from the existing Java and Rust relay.
# An audited client-side MLS runtime is a separate release gate.
[dependencies]
openmls = "=0.9.2"
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[dev-dependencies]
pictochat-relay = { path = "../server" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
