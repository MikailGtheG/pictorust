[package]
name = "pictorust-mls-web"
version = "0.2.0-rc.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pictochat-mls-lab = { path = "../mls-lab" }
openmls = { version = "=0.9.2", features = ["js"] }
wasm-bindgen = "0.2.100"
js-sys = "0.3"
hex = "0.4"

# Browser randomness for OpenMLS and transitive RustCrypto dependencies.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
